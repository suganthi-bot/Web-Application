<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modern Login Page</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2ff;
        }

        .container {
            width: 850px;
            min-height: 500px;
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        /* Left Section */

        .left-section {
            width: 45%;
            padding: 50px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );
        }

        .left-section h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .left-section p {
            line-height: 1.7;
            color: #e0e7ff;
        }

        .icon {
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            font-size: 45px;
        }

        /* Right Section */

        .right-section {
            width: 55%;
            padding: 50px;
        }

        .right-section h2 {
            color: #222;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px
                rgba(37, 99, 235, 0.1);
        }

        /* Options */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .options a {
            color: #2563eb;
            text-decoration: none;
        }

        /* Button */

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        /* Register */

        .register {
            text-align: center;
            margin-top: 25px;
            color: #777;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .container {
                width: 90%;
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .left-section {
                padding: 35px;
            }

            .left-section h1 {
                font-size: 30px;
            }

            .right-section {
                padding: 35px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- Welcome Section -->

        <div class="left-section">

            <div class="icon">
                🔐
            </div>

            <h1>Welcome Back!</h1>

            <p>
                Login to continue to your account.
                Manage your profile, access your
                dashboard and explore our services.
            </p>

        </div>


        <!-- Login Section -->

        <div class="right-section">

            <h2>Sign In</h2>

            <p class="subtitle">
                Enter your details below
            </p>

            <form>

                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Options -->

                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Sign In

                </button>

            </form>


            <!-- Register -->

            <div class="register">

                Don't have an account?

                <a href="#">
                    Sign Up
                </a>

            </div>

        </div>

    </div>

</body>

</html>
