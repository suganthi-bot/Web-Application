<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Glass Login Page</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff,
                    #7f00ff
                );
        }

        /* Decorative circles */

        body::before {
            content: "";
            position: absolute;

            width: 220px;
            height: 220px;

            background: #ff4ecd;
            border-radius: 50%;

            top: 8%;
            left: 12%;
        }

        body::after {
            content: "";
            position: absolute;

            width: 180px;
            height: 180px;

            background: #00ffcc;
            border-radius: 50%;

            bottom: 8%;
            right: 12%;
        }

        /* Login Card */

        .login-card {
            position: relative;
            z-index: 1;

            width: 380px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.15);

            border: 1px solid
                rgba(255, 255, 255, 0.3);

            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 40px
                rgba(0, 0, 0, 0.2);
        }

        /* Heading */

        .login-card h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #e5e7eb;
            margin-bottom: 30px;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: rgba(255, 255, 255, 0.9);

            font-size: 15px;
        }

        .input-group input:focus {
            outline: 2px solid white;
        }

        /* Options */

        .options {
            display: flex;
            justify-content: space-between;

            color: white;
            font-size: 14px;

            margin-bottom: 25px;
        }

        .options a {
            color: white;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        /* Button */

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: white;
            color: #4f46e5;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {
            background: #4f46e5;
            color: white;
        }

        /* Register */

        .register {
            text-align: center;
            margin-top: 25px;
            color: white;
        }

        .register a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .login-card {
                width: 90%;
                padding: 30px;
            }

            body::before {
                width: 130px;
                height: 130px;
            }

            body::after {
                width: 120px;
                height: 120px;
            }

        }

    </style>

</head>

<body>

    <!-- Login Card -->

    <div class="login-card">

        <h1>Login</h1>

        <p class="subtitle">
            Welcome back! Please login to continue.
        </p>


        <!-- Login Form -->

        <form>

            <!-- Email -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Options -->

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-button">

                Login

            </button>

        </form>


        <!-- Register -->

        <div class="register">

            <p>
                Don't have an account?
                <a href="#">
                    Register Now
                </a>
            </p>

        </div>

    </div>

</body>

</html>
